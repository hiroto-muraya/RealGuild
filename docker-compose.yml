# ローカル開発用 PostgreSQL（本番は Neon を使用）
services:
  db:
    image: postgres:17
    container_name: realguild-db
    environment:
      POSTGRES_DB: realguild
      POSTGRES_USER: realguild
      POSTGRES_PASSWORD: realguild_dev
    ports:
      - "5432:5432"
    volumes:
      - realguild-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realguild -d realguild"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  realguild-db-data:
